	<script>
	(function () {
		if (location.protocol === "file:") {
			document.body.style.cssText = "overflow:auto;padding:2rem;font-family:Segoe UI,sans-serif;background:#111;color:#eee;";
			document.body.innerHTML =

			return;
		}

		var intro = document.getElementById("game-intro");
		document.addEventListener("pointerdown", function () {
			if (intro) intro.classList.add("is-hidden");
		}, { once: true, capture: true });

		function loadScript(src, defer) {
			return new Promise(function (resolve, reject) {
				var s = document.createElement("script");
				s.src = src;
				if (defer) s.defer = true;
				s.onload = resolve;
				s.onerror = reject;
				document.body.appendChild(s);
			});
		}

		loadScript("assets/lib/poki-sdk-stub.js")
			.then(function () { return loadScript("assets/lib/nape.min.js"); })
			.then(function () { return loadScript("assets/lib/jquery-3.1.1.min.js"); })
			.then(function () { return loadScript("assets/lib/easeljs-0.8.2.combined.js"); })
			.then(function () { return loadScript("assets/lib/phaser.min.js"); })
			.then(function () { return loadScript("assets/lib/phaser-cachebuster.min.js"); })
			.then(function () { return loadScript("assets/lib/phaser-super-storage.min.js"); })
			.then(function () { return loadScript("assets/lib/dragonBones.min.js"); })
			.then(function () { return loadScript("assets/lib/pksl.js"); })
			.then(function () { return loadScript("basketball_legends_2020.min.js"); })
			.then(function () { return loadScript("../hub-bar.js", true); })
			.catch(function (err) { console.error("Failed to load game scripts", err); });
